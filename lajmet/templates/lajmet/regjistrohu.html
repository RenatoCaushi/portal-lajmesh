{% extends "base.html" %}

{% block meta_tags %}
    <title>Regjistrohu - Konfidenciale News</title>
{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4 border-0 rounded-3">
        <h2 class="fw-bold mb-4 text-center text-dark">Krijo një Llogari</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mt-3">Regjistrohu</button>
        </form>
        <p class="text-center mt-4 text-muted">
            Keni tashmë një llogari? <a href="{% url 'hyrje' %}" class="text-danger fw-bold text-decoration-none">Identifikohuni</a>
        </p>
    </div>
</div>
{% endblock %}
